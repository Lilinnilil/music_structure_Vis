<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Structure Visualizer</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/tone@14.7.58/build/Tone.js"></script>

    <style>
        :root {
            color-scheme: dark;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #page-shell {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #111;
            border-bottom: 1px solid #333;
        }

        #toolbar select,
        #toolbar button {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 12px;
        }

        #toolbar select {
            min-width: min(360px, 100%);
            flex: 1 1 360px;
        }

        #visualizer-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 8px 10px 10px;
            gap: 6px;
        }

        #visualizer-canvas {
            flex: 1;
            min-height: 0;
            border: 1px solid #333;
            background: #000;
            overflow: hidden;
        }

        #legend-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        #legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 6px 0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #eee;
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }

        #timeline-controls {
            padding: 4px 0 0;
        }

        #x-scrollbar {
            width: 100%;
            height: 10px;
            cursor: pointer;
            appearance: none;
            background: #222;
            border-radius: 6px;
        }

        #x-scrollbar::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #b1b1b1;
        }

        .draggable-chart { cursor: grab; }
        .draggable-chart:active { cursor: grabbing; }
        .note { stroke: none; transition: opacity 0.03s ease-out, filter 0.1s; cursor: default; }
        .note.glow { filter: url(#glow); opacity: 1 !important; z-index: 10; }
        .track-line { pointer-events: none; stroke-width: 1.5px; opacity: 0.4; stroke-dasharray: none; transition: opacity 0.3s; }
        .axis text { fill: #aaa; font-size: 11px; }
        .axis path, .axis line { stroke: transparent; }
        .bar-label { fill: #ddd; font-size: 12px; font-weight: bold; text-anchor: middle; }
        .grid-line-y { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
        .bar-line { stroke: rgba(255, 255, 255, 0.5); stroke-width: 2; }
        .beat-line { stroke: rgba(255, 255, 255, 0.2); stroke-width: 1; }
        .black-key-bg { fill: rgba(255, 255, 255, 0.05); }
        .rhythm-beat-point.highlight { fill: #FFD700; filter: drop-shadow(0 0 5px #FFD700); }
        .percussion-beat-overlay { fill: none; stroke: rgba(255, 255, 255, 0.75); stroke-width: 5px; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9)); pointer-events: none; }
        .percussion-beat-overlay.active-percussion-overlay { display: inline; }
    </style>
</head>
<body>
    <div id="page-shell">
        <div id="toolbar">
            <label for="track-select">Data file</label>
            <select id="track-select"></select>
            <button id="playPauseBtn">Play / Preparing...</button>
            <button id="toggleDisplayModeBtn">Mode: Piano Roll</button>
            <button id="togglePercussionBtn">Percussion: On</button>
        </div>

        <div id="visualizer-container">
            <div id="legend-row">
                <div id="legend"></div>
            </div>
            <div id="visualizer-canvas"></div>
            <div id="timeline-controls">
                <input type="range" id="x-scrollbar" min="0" max="10000" value="0">
            </div>
        </div>
    </div>

    <script src="src/config.js?v=20260728b"></script>
    <script src="src/visualizer.js?v=20260728b"></script>
    <script src="src/app.js?v=20260728b"></script>
